<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HXrag · 卫星频规问答</title>
<style>
:root{font-family:Inter,"Segoe UI","Microsoft YaHei",sans-serif;color:#20231f;background:#f7f8f5;font-synthesis:none}*{box-sizing:border-box}body{margin:0;display:flex;min-height:100vh}button,textarea{font:inherit}button{cursor:pointer}.sidebar{width:248px;flex:none;background:#eef0e9;border-right:1px solid #dde1d7;padding:24px 18px;display:flex;flex-direction:column;gap:22px}.brand{display:flex;align-items:center;gap:11px;font-size:18px;font-weight:650}.mark{width:34px;height:34px;border:1px solid #56634d;border-radius:50%;display:grid;place-items:center;color:#56634d}.mark:after{content:"";width:16px;height:8px;border:1px solid #56634d;border-radius:50%;transform:rotate(-28deg)}.new-chat,.sync{border:1px solid #d4d9cd;background:#fafbf8;border-radius:9px;padding:10px 12px;text-align:left;color:#30372c}.new-chat{background:#34442e;color:white;border-color:#34442e}.new-chat:hover{background:#42553a}.sync:hover{background:white}.section-label{font-size:12px;color:#7b8275;letter-spacing:.08em;margin-bottom:10px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat{background:#f8f9f5;border:1px solid #dfe3d9;border-radius:9px;padding:11px}.stat strong{display:block;font-size:20px;font-weight:550}.stat span{font-size:12px;color:#7b8275}.model{margin-top:auto;padding-top:16px;border-top:1px solid #d9ded2;font-size:13px}.model-row{display:flex;align-items:center;gap:7px}.dot{width:7px;height:7px;border-radius:50%;background:#b0b4ac}.dot.ready{background:#4d8051}.model small{display:block;color:#7b8275;margin-top:7px;line-height:1.6;word-break:break-all}.main{flex:1;display:flex;flex-direction:column;min-width:0;height:100vh}.topbar{height:67px;flex:none;border-bottom:1px solid #e2e5dd;background:rgba(247,248,245,.95);display:flex;align-items:center;justify-content:space-between;padding:0 32px}.topbar strong{font-size:14px}.badge{font-size:11px;letter-spacing:.08em;color:#66715e;border:1px solid #d7ddd0;padding:4px 8px;border-radius:20px}.chat{width:min(830px,100%);margin:0 auto;flex:1;overflow-y:auto;padding:44px 28px 24px}.welcome{text-align:center;margin:11vh auto 30px;max-width:570px}.welcome h1{font-size:30px;font-weight:500;letter-spacing:-.03em;margin:16px 0 10px}.welcome p{color:#7a8174;font-size:14px;line-height:1.8}.samples{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin-top:24px}.samples button{border:1px solid #dce1d5;border-radius:20px;background:white;color:#586250;padding:8px 13px;font-size:13px}.samples button:hover{border-color:#8b9880}.message{margin:0 0 28px}.message.user{display:flex;justify-content:flex-end;margin-left:18%}.user-content{background:#e8ede3;border-radius:15px 15px 3px 15px;padding:11px 15px;max-width:100%;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;line-height:1.65}.assistant-label{font-size:12px;color:#788270;margin-bottom:9px}.answer{font-size:14px;line-height:1.85;white-space:pre-wrap;overflow-wrap:anywhere}.citations{margin-top:16px;border-top:1px solid #e2e6de;padding-top:12px}.citations h3{font-size:12px;font-weight:500;color:#788270;margin:0 0 9px}.citation{display:flex;gap:10px;background:#f0f2ec;border:1px solid #e1e5dc;border-radius:9px;padding:11px 12px;margin-top:7px}.ref{color:#65745b;font-size:12px;flex:none}.citation strong{font-size:13px;font-weight:550}.citation p{font-size:12px;color:#737b6e;line-height:1.65;margin:5px 0 0;white-space:pre-wrap}.citation a{color:#4d6743;text-decoration:none}.thinking{color:#7b8474;font-size:13px}.error{color:#a0473f;background:#f9ece8;border:1px solid #efd5ce;padding:11px 13px;border-radius:9px;font-size:13px;line-height:1.6}.composer-wrap{flex:none;padding:14px 28px 23px;background:linear-gradient(transparent,#f7f8f5 22%)}.composer{width:min(774px,100%);margin:auto;display:flex;align-items:flex-end;gap:10px;border:1px solid #d8ded1;background:white;border-radius:15px;padding:10px 10px 10px 15px;box-shadow:0 7px 25px rgba(44,55,37,.05)}textarea{resize:none;border:0;outline:0;flex:1;max-height:150px;line-height:1.55;padding:6px 0;background:transparent;font-size:14px}.send{width:35px;height:35px;flex:none;border:0;border-radius:10px;background:#34442e;color:white;font-size:18px}.send:disabled{opacity:.35;cursor:default}.hint{text-align:center;font-size:11px;color:#959b90;margin-top:8px}.toast{position:fixed;right:22px;bottom:22px;max-width:360px;background:#293226;color:white;padding:11px 15px;border-radius:9px;font-size:13px;display:none;z-index:2}.mobile-menu{display:none}
@media(max-width:720px){.sidebar{width:210px;padding:18px 13px}.main{height:100dvh}.chat{padding:25px 18px}.topbar{padding:0 19px}.composer-wrap{padding:12px}.welcome{margin-top:7vh}.welcome h1{font-size:25px}.message.user{margin-left:8%}}@media(max-width:520px){.sidebar{position:absolute;z-index:3;height:100%;transform:translateX(-100%);transition:.2s}.sidebar.open{transform:translateX(0)}.mobile-menu{display:block;border:0;background:transparent;font-size:20px;padding:5px}.topbar{justify-content:flex-start;gap:12px}.topbar .badge{margin-left:auto}}
</style>
</head>
<body>
<aside class="sidebar" id="sidebar">
  <div class="brand"><span class="mark"></span>HXrag</div>
  <button class="new-chat" id="newChat">＋ 新对话</button>
  <button class="sync" id="sync">↻ 重新载入知识库</button>
  <div><div class="section-label">检索索引</div><div class="stats"><div class="stat"><strong id="documents">—</strong><span>资料</span></div><div class="stat"><strong id="chunks">—</strong><span>文本块</span></div></div></div>
  <div class="model"><div class="model-row"><span class="dot" id="modelDot"></span><span id="model">正在连接</span></div><small id="modelHint">读取本地服务状态…</small></div>
</aside>
<main class="main">
  <header class="topbar"><button class="mobile-menu" id="menu">☰</button><strong>卫星频规检索问答</strong><span class="badge">C++ · RAG</span></header>
  <section class="chat" id="chat">
    <div class="welcome" id="welcome"><h1>从资料中找到答案</h1><p>检索本地文件与已同步的 Wiki 知识，由 Kimi 根据命中证据回答，并附上可核验的引用。</p><div class="samples"><button data-q="演示规则中，频率使用许可有效期是多久？">许可有效期</button><button data-q="演示地球站需要保存哪些运行记录？">地球站日志</button><button data-q="变更卫星轨道位置需要做什么？">卫星变更</button></div></div>
    <div id="messages"></div>
  </section>
  <div class="composer-wrap"><form class="composer" id="form"><textarea id="question" aria-label="输入问题" placeholder="输入与知识库有关的问题…" rows="1"></textarea><button class="send" id="send" disabled aria-label="发送">↑</button></form><div class="hint">Enter 发送 · Shift + Enter 换行</div></div>
</main>
<div class="toast" id="toast"></div>
<script>
const $=id=>document.getElementById(id);let history=[],busy=false;
function toast(text){$('toast').textContent=text;$('toast').style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').style.display='none',4500)}
async function api(path,body){const response=await fetch(path,{method:body===undefined?'GET':'POST',headers:body===undefined?{}:{'Content-Type':'application/json'},body:body===undefined?undefined:JSON.stringify(body)});const data=await response.json().catch(()=>({error:'服务响应格式不正确。'}));if(!response.ok)throw new Error(data.error||'请求失败。');return data}
async function status(){try{const s=await api('/api/rag/status');$('documents').textContent=s.documents;$('chunks').textContent=s.chunks;$('model').textContent=s.model;$('modelDot').className='dot'+(s.kimiKeyConfigured?' ready':'');$('modelHint').textContent=s.kimiKeyConfigured?`Wiki ${s.wikiRecords} 条 · ${s.lastSync||'尚未同步'}`:'请编辑 config.json 的 kimi_api_key';if(s.lastError)$('modelHint').textContent=s.lastError;}catch(e){$('model').textContent='服务未连接';$('modelHint').textContent=e.message}}
function render(){const box=$('messages');box.replaceChildren();$('welcome').style.display=history.length||busy?'none':'block';for(const m of history){const article=document.createElement('article');article.className='message '+(m.role==='user'?'user':'assistant');if(m.role==='user'){const p=document.createElement('div');p.className='user-content';p.textContent=m.content;article.append(p)}else{const label=document.createElement('div');label.className='assistant-label';label.textContent='HXrag';const answer=document.createElement('div');answer.className='answer';answer.textContent=m.content;article.append(label,answer);if(m.citations?.length){const section=document.createElement('div');section.className='citations';const heading=document.createElement('h3');heading.textContent='引用';section.append(heading);m.citations.forEach((c,i)=>{const row=document.createElement('div');row.className='citation';const number=document.createElement('span');number.className='ref';number.textContent='['+(i+1)+']';const content=document.createElement('div');const title=document.createElement(c.sourceUrl?'a':'strong');title.textContent=c.title||'未命名资料';if(c.sourceUrl){try{const url=new URL(c.sourceUrl);if(!['http:','https:'].includes(url.protocol))throw new Error();title.href=url.href;title.target='_blank';title.rel='noreferrer'}catch{}}const quote=document.createElement('p');quote.textContent=c.quote||'';content.append(title,quote);row.append(number,content);section.append(row)});article.append(section)}}box.append(article)}if(busy){const thinking=document.createElement('div');thinking.className='thinking';thinking.textContent='正在检索并生成回答…';box.append(thinking)}$('chat').scrollTop=$('chat').scrollHeight}
async function send(){const content=$('question').value.trim();if(!content||busy)return;busy=true;$('question').value='';autoSize();$('send').disabled=true;history.push({role:'user',content});render();try{const data=await api('/api/rag/chat',{messages:history.slice(-20).map(({role,content})=>({role,content}))});history.push(data.message)}catch(e){const error=document.createElement('div');error.className='error';error.id='lastError';error.textContent=e.message;$('messages').append(error);toast(e.message)}finally{busy=false;$('send').disabled=!$('question').value.trim();render()}}
function autoSize(){$('question').style.height='auto';$('question').style.height=Math.min($('question').scrollHeight,150)+'px'}
$('form').addEventListener('submit',e=>{e.preventDefault();send()});$('question').addEventListener('input',()=>{autoSize();$('send').disabled=busy||!$('question').value.trim()});$('question').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();send()}});$('newChat').onclick=()=>{history=[];busy=false;$('question').value='';render();$('sidebar').classList.remove('open')};$('sync').onclick=async()=>{if(busy)return;$('sync').disabled=true;$('sync').textContent='正在重新载入…';try{await api('/api/rag/sync',{});await status();toast('知识库已重新载入')}catch(e){toast(e.message)}finally{$('sync').disabled=false;$('sync').textContent='↻ 重新载入知识库'}};$('menu').onclick=()=>$('sidebar').classList.toggle('open');document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{$('question').value=b.dataset.q;$('question').dispatchEvent(new Event('input'));$('question').focus()});status();render();$('question').focus();
</script>
</body>
</html>
